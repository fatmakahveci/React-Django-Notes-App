services:
  db:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  redis:
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:?Set the immutable backend image}
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--timeout", "60"]
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_production
      APP_RELEASE: ${APP_RELEASE:?Set the release tag}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set a strong production secret}
      DATABASE_URL: ${DATABASE_URL:?Set the production PostgreSQL URL}
      DJANGO_CACHE_URL: ${DJANGO_CACHE_URL:?Set the production Redis URL}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set production hosts}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?Set trusted HTTPS origins}
    ports: !reset []

  frontend:
    image: ${FRONTEND_IMAGE:?Set the immutable frontend image}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=8m
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
