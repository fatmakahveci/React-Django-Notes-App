name: Fullstack CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  release-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release metadata and deployment script
        run: |
          python -m json.tool release-please-config.json >/dev/null
          python -m json.tool .release-please-manifest.json >/dev/null
          bash -n scripts/deploy-production.sh

      - name: Validate production Compose merge
        env:
          BACKEND_IMAGE: ghcr.io/example/notes-backend:sha-0000000000000000000000000000000000000000
          FRONTEND_IMAGE: ghcr.io/example/notes-frontend:sha-0000000000000000000000000000000000000000
          APP_RELEASE: v1.0.0
          DJANGO_SECRET_KEY: ci-only-secret-with-more-than-fifty-distinct-characters-123456
          DATABASE_URL: postgresql://notes:notes@db:5432/notes
          DJANGO_CACHE_URL: redis://redis:6379/0
          DJANGO_ALLOWED_HOSTS: notes.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://notes.example.com
        run: docker compose -f compose.yaml -f compose.production.yaml config --quiet

  container-security:
    name: container-security (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build runtime image locally
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          load: true
          tags: local/notes-${{ matrix.component }}:ci
          cache-from: type=gha,scope=ci-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.component }}

      - name: Reject known high and critical vulnerabilities
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: local/notes-${{ matrix.component }}:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
      DJANGO_CACHE_URL: redis://127.0.0.1:6379/0
      DJANGO_CACHE_KEY_PREFIX: notes-ci
      DJANGO_CACHE_VERSION: 1
      DJANGO_TEST_USE_REDIS: "true"
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Audit Python dependencies
        run: |
          python -m pip_audit -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Migrate
        run: python manage.py migrate

      - name: Validate OpenAPI schema and endpoint contract
        run: |
          python manage.py spectacular --file /tmp/openapi.yaml --validate --fail-on-warn
          openapi-spec-validator /tmp/openapi.yaml
          python manage.py test config.test_openapi_contract

      - name: Run tests
        run: |
          coverage run manage.py test
          coverage report

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Enforce Lighthouse quality thresholds
        run: npm run lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: frontend/lighthouse-reports
          if-no-files-found: ignore
          retention-days: 14
