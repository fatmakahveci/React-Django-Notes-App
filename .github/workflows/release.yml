name: Release and production deployment

on:
  workflow_run:
    workflows: [Fullstack CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag whose images should be rebuilt
        required: false
        type: string
      deploy:
        description: Deploy after rebuilding an existing release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    timeout-minutes: 60
    name: Prepare or publish release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.manual.outputs.created || steps.release.outputs.release_created }}
      tag: ${{ steps.manual.outputs.tag || steps.release.outputs.tag_name }}
      sha: ${{ steps.manual.outputs.sha || steps.release.outputs.sha }}
    steps:
      - name: Resolve existing release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        id: manual
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          release_sha=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Update release pull request or publish GitHub Release
        if: github.event_name != 'workflow_dispatch' || inputs.release_tag == ''
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  images:
    timeout-minutes: 60
    name: Build ${{ matrix.component }} image
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      packages: write
      id-token: write
      security-events: write
    env:
      IMAGE_NAME: ghcr.io/fatmakahveci/react-django-notes-app-${{ matrix.component }}
    strategy:
      fail-fast: true
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release.outputs.sha }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate immutable image tags
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.release.outputs.tag }}
            type=raw,value=sha-${{ needs.release.outputs.sha }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Scan published image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.component }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload scan result to Security
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.component)) != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: trivy-${{ matrix.component }}.sarif
          category: release-${{ matrix.component }}

      - name: Attest image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Deploy production
    needs: [release, images]
    if: >-
      needs.release.outputs.created == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Validate deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
          DEPLOY_PATH: ${{ vars.PRODUCTION_DEPLOY_PATH }}
          DEPLOY_URL: ${{ vars.PRODUCTION_URL }}
          HOST_KEY: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          test -n "$HOST_KEY"
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_URL" =~ ^https:// ]]

      - name: Configure pinned SSH host identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy deployment definition
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
          DEPLOY_PATH: ${{ vars.PRODUCTION_DEPLOY_PATH }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "install -d -m 750 '$DEPLOY_PATH'"
          scp compose.yaml compose.production.yaml scripts/deploy-production.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Deploy immutable release and verify health
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
          DEPLOY_PATH: ${{ vars.PRODUCTION_DEPLOY_PATH }}
          DEPLOY_URL: ${{ vars.PRODUCTION_URL }}
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          backend_image="ghcr.io/${GITHUB_REPOSITORY,,}-backend:sha-$RELEASE_SHA"
          frontend_image="ghcr.io/${GITHUB_REPOSITORY,,}-frontend:sha-$RELEASE_SHA"
          printf -v remote_command 'bash %q %q %q %q %q %q' \
            "$DEPLOY_PATH/deploy-production.sh" "$DEPLOY_PATH" "$backend_image" \
            "$frontend_image" "$RELEASE_TAG" "$DEPLOY_URL"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command"
