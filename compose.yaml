name: react-django-notes

services:
  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /data

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notes}
      POSTGRES_USER: ${POSTGRES_USER:-notes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notes-local-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-notes}:${POSTGRES_PASSWORD:-notes-local-password}@db:5432/${POSTGRES_DB:-notes}
      DJANGO_SETTINGS_MODULE: config.settings_development
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-docker-compose-development-key-change-me}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      DJANGO_CACHE_URL: redis://redis:6379/0
      DJANGO_CACHE_KEY_PREFIX: notes-compose
      DJANGO_CACHE_VERSION: ${DJANGO_CACHE_VERSION:-1}
      DJANGO_CACHE_DEFAULT_TIMEOUT: ${DJANGO_CACHE_DEFAULT_TIMEOUT:-300}
      APP_RELEASE: ${APP_RELEASE:-local-compose}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/accounts/csrf/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres_data:
